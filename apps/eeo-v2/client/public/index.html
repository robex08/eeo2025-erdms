<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Language" content="cs" />
    
    <!-- Favicon - různé velikosti pro různá zařízení -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48x48.png" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    
    <!-- Android Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="language" content="Czech" />
    <meta
      name="description"
      content="Systém správy a workflow objednávek"
    />
    <!-- Build hash - bude automaticky vygenerován během buildu -->
    <meta name="build-hash" content="__BUILD_HASH__" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Google Fonts - Roboto (standard) + Roboto Condensed pro tabulky -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Systém správy a workflow objednávek</title>
    <script>
      // Zaznamenat čas spuštění pro minimální dobu zobrazení splash screen
      window.splashStartTime = Date.now();
    </script>
    <style>
      /* Splash screen CSS - zobrazí se okamžitě před načtením React aplikace */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #1f2a57 0%, #2c3e7a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        animation: fadeIn 0.3s ease-in;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      #splash-screen .logo-container {
        margin-bottom: 2rem;
        animation: fadeIn 0.5s ease-in;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      
      #splash-screen .logo-image {
        width: 225px;
        height: 225px;
        object-fit: contain;
        filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.3));
        animation: fadeIn 0.6s ease-in;
      }
      
      #splash-screen .logo {
        font-size: 2.5rem;
        font-weight: 700;
        color: #ffffff;
        text-align: center;
        letter-spacing: 3px;
        text-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      #splash-screen .subtitle {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        margin-top: 0.5rem;
        letter-spacing: 1px;
      }
      
      #splash-screen .spinner-container {
        margin: 2rem 0;
      }
      
      #splash-screen .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      #splash-screen .loading-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.95rem;
        margin-top: 1.5rem;
        animation: pulse 1.5s ease-in-out infinite;
        letter-spacing: 0.5px;
      }
      
      #splash-screen .version-text {
        position: absolute;
        bottom: 2rem;
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.85rem;
      }
      
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      
      /* Skryje splash screen když je React připravený */
      .app-loaded #splash-screen {
        animation: fadeOut 0.5s ease-out forwards;
      }
      
      .app-loaded #splash-screen.hidden {
        display: none;
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#ffffff;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- 🎯 KRITICKÝ SCRIPT: Kontrola cold start PŘED zobrazením splash screenu -->
    <script>
      // Kontrola OKAMŽITĚ - před parsováním zbytku HTML
      window.__showSplash = !sessionStorage.getItem('app_initialized');
    </script>
    
    <!-- Splash screen - zobrazí se POUZE při cold start -->
    <div id="splash-screen">
      <div class="logo-container" style="margin-bottom:2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;">
        <img src="%PUBLIC_URL%/logo512.png" alt="ZZS Logo" class="logo-image" style="width:225px;height:225px;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.3));" onerror="this.style.display='none'" />
        <div class="logo" style="font-size:2.5rem;font-weight:700;color:#ffffff;text-align:center;letter-spacing:3px;text-shadow:0 4px 20px rgba(37,99,235,0.5);background:linear-gradient(135deg,#ffffff 0%,#e0e7ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">ERDMS</div>
        <div class="subtitle" style="font-size:1rem;color:rgba(255,255,255,0.8);text-align:center;margin-top:0.5rem;letter-spacing:1px;">Systém správy a workflow objednávek</div>
      </div>
      <div class="spinner-container" style="margin:2rem 0;">
        <div class="spinner" style="width:50px;height:50px;border:4px solid rgba(255,255,255,0.1);border-top:4px solid #ffffff;border-radius:50%;animation:spin 1s linear infinite;"></div>
      </div>
      <div class="loading-text" style="color:rgba(255,255,255,0.9);font-size:0.95rem;margin-top:1.5rem;letter-spacing:0.5px;">Spouštění aplikace...</div>
      <div class="version-text" style="position:absolute;bottom:2rem;color:rgba(255,255,255,0.4);font-size:0.85rem;" id="splash-version">verze %REACT_APP_VERSION%</div>
    </div>
    <script>
      // 🎯 Aplikovat zobrazení/skrytí splash screenu na základě cold start detekce
      (function() {
        const splashScreen = document.getElementById('splash-screen');
        
        if (window.__showSplash && splashScreen) {
          // Cold start - zobrazit splash screen
          splashScreen.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1f2a57 0%,#2c3e7a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;';
          
          // Načtení verze při startu
          const versionEl = document.getElementById('splash-version');
          if (versionEl && versionEl.textContent.includes('%REACT_APP_VERSION%')) {
            versionEl.textContent = 'verze načítání...';
          }
        } else if (splashScreen) {
          // Reload - odstranit splash okamžitě (ani se neobjeví)
          splashScreen.remove();
        }
      })();
    </script>
    
    <div id="root"></div>

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
