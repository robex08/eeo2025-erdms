# ============================================
# INVENTIK - Apache Configuration
# Domain: erdms.zachranka.cz/inventik
# React App + PHP API
# ============================================

# ============================================
# INVENTIK APPLICATION (/inventik/ subdirectory)
# ============================================

# React Frontend (Production Build)
Alias /inventik /var/www/erdms-dev/apps/inventik/build

<Directory /var/www/erdms-dev/apps/inventik/build>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
    
    # React Router pro subdirectory
    RewriteEngine On
    RewriteBase /inventik/
    RewriteRule ^index\.html$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/inventik/api/
    RewriteRule . /inventik/index.html [L]
</Directory>

# ============================================
# INVENTIK PHP API (/inventik/api/)
# ============================================

Alias /inventik/api /var/www/erdms-dev/apps/inventik/api

<Directory /var/www/erdms-dev/apps/inventik/api>
    Options +ExecCGI -Indexes
    AllowOverride All
    Require all granted
    
    # PHP-FPM Handler
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>
    
    # Allow .htaccess overrides
    DirectoryIndex api.php
    
    # CORS headers (if needed)
    Header set Access-Control-Allow-Origin "*"
    Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header set Access-Control-Allow-Headers "Content-Type, Authorization"
</Directory>

# ============================================
# DEV VERSION (/dev/inventik/)
# ============================================

# DEV Frontend - proxy to React dev server
<Location /dev/inventik>
    ProxyPass http://localhost:3002
    ProxyPassReverse http://localhost:3002
    ProxyPreserveHost On
</Location>

# DEV API - direct access to API folder
Alias /dev/inventik/api /var/www/erdms-dev/apps/inventik/api

<Directory /var/www/erdms-dev/apps/inventik/api>
    Options +ExecCGI -Indexes
    AllowOverride All
    Require all granted
    
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>
</Directory>
