# ============================================
# DEV BURZA-SLUZBY Frontend + API (/dev/burza-sluzby)
# ============================================

# IMPORTANT:
# Add this snippet BEFORE generic dashboard fallback rewrite rules.
# If dashboard catches /dev/burza-sluzby, browser loads dashboard bundle
# (e.g. /assets/index-Ddoy-iNT.js) and app route will fail.

# If your vhost uses ProxyPass defaults, explicitly disable proxying for this app path.
<Location /dev/burza-sluzby>
    ProxyPass !
</Location>

<Location /dev/api.burza-sluzby>
    ProxyPass !
</Location>

# Frontend build (Vite output)
Alias /dev/burza-sluzby /var/www/erdms-dev/apps/burza-sluzby/client/build

<Directory /var/www/erdms-dev/apps/burza-sluzby/client/build>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    RewriteEngine On
    RewriteBase /dev/burza-sluzby/
    RewriteRule ^index\.html$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /dev/burza-sluzby/index.html [L]
</Directory>

# In dashboard DocumentRoot rewrite block add exclusions like:
# RewriteCond %{REQUEST_URI} !^/dev/burza-sluzby
# RewriteCond %{REQUEST_URI} !^/dev/api.burza-sluzby

# PHP API backend
Alias /dev/api.burza-sluzby /var/www/erdms-dev/apps/burza-sluzby/api

<Directory /var/www/erdms-dev/apps/burza-sluzby/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>
</Directory>
